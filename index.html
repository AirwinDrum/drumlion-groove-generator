<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>Drumlion Groove Generator</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

html, body {
  height: 100%;
  background: #0a0a0a;
  overflow: hidden;
}

body {
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'DM Sans', system-ui, sans-serif;
  color: #ffffff;
}

.dg-wrap {
  width: 100vw;
  height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: clamp(16px, 3vw, 40px) clamp(16px, 5vw, 80px);
  overflow: hidden;
}

.dg-inner {
  width: 100%;
  max-width: min(1200px, 96vw);
  display: flex;
  flex-direction: column;
  gap: clamp(6px, 1.2vh, 14px);
}

/* Header */
.dg-header { text-align: center; }
.dg-header h2 {
  color: #C9A84C;
  font-size: clamp(16px, 3vw, 24px);
  font-weight: 700;
  letter-spacing: -0.5px;
  line-height: 1;
}
.dg-header .subtitle {
  color: #ffffff;
  font-size: clamp(11px, 2vw, 14px);
  margin-top: 4px;
}

/* Notation box */
.notation-box {
  background: #141414;
  border-radius: 14px;
  padding: clamp(6px, 1.2vh, 12px) clamp(6px, 1.5vw, 14px);
  border: 1px solid #222;
  position: relative;
  overflow: hidden;
  flex: 1;
  display: flex;
  align-items: center;
}
.notation-box svg {
  display: block;
  width: 100%;
  max-width: 100%;
  height: auto;
}

/* Count-in overlay */
.countin-overlay {
  position: absolute; inset: 0;
  display: flex; align-items: center; justify-content: center;
  background: rgba(10,10,10,0.88);
  border-radius: 14px; z-index: 10;
}
.countin-number {
  font-size: clamp(52px, 16vw, 100px);
  font-weight: 700; color: #C9A84C;
  text-shadow: 0 0 40px rgba(201,168,76,0.35);
  animation: dgPulse 0.28s ease-out;
  transition: opacity 0.1s;
}
@keyframes dgPulse {
  0%   { transform: scale(1.35); opacity: 0.4; }
  100% { transform: scale(1);    opacity: 1; }
}

/* Phase row */
.phase-row {
  display: flex; align-items: center; justify-content: center; gap: 14px;
}
.phase-badge {
  padding: 5px 14px; border-radius: 20px;
  font-size: clamp(10px, 1.8vw, 12px); font-weight: 600;
  letter-spacing: 1px; text-transform: uppercase; white-space: nowrap;
}
.countdown {
  font-size: clamp(22px, 5vw, 32px); font-weight: 700;
  font-variant-numeric: tabular-nums; color: #ffffff;
  min-width: 52px; text-align: center;
}
.phase-info {
  color: #ffffff;
  font-size: clamp(11px, 2vw, 13px);
  text-align: center; min-height: 16px;
}

/* Blocks bar */
.blocks-bar {
  display: flex; gap: 3px; width: 100%;
}
.block-seg {
  height: 30px; border-radius: 6px;
  display: flex; align-items: center; justify-content: center;
  border: 1px solid #2a2a2a; transition: all 0.3s ease;
  flex-direction: column; line-height: 1.2;
  min-width: 0; overflow: hidden; padding: 0 3px;
}
.b-bpm { font-size: clamp(8px, 2vw, 12px); font-weight: 700; white-space: nowrap; }
.b-dur { font-size: clamp(6px, 1.4vw, 9px); opacity: 0.6; white-space: nowrap; }
.pause-seg {
  height: 30px; display: flex; align-items: center; justify-content: center;
  font-size: clamp(7px, 1.4vw, 9px); color: #aaaaaa;
  min-width: 18px; flex-shrink: 0;
}

/* BPM selector */
.bpm-selector { text-align: center; }
.bpm-controls {
  display: flex; align-items: center; justify-content: center;
  gap: clamp(10px, 3vw, 28px); margin-bottom: 10px;
}
.bpm-btn {
  width: clamp(36px, 8vw, 48px); height: clamp(36px, 8vw, 48px);
  border-radius: 50%; border: 1px solid #333; background: #161616;
  color: #ffffff; font-size: clamp(16px, 3.5vw, 22px);
  cursor: pointer; display: flex; align-items: center; justify-content: center;
  transition: background 0.2s; flex-shrink: 0; user-select: none;
}
.bpm-btn:hover { background: #242424; }
.bpm-btn:active { background: #333; }
.bpm-display { text-align: center; min-width: 0; flex: 1; max-width: 160px; }
.bpm-val {
  font-size: clamp(36px, 10vw, 64px); font-weight: 700;
  line-height: 1; color: #ffffff;
  display: block; white-space: nowrap; overflow: hidden;
}
.bpm-lbl {
  font-size: clamp(10px, 2vw, 13px); color: #ffffff;
  text-transform: uppercase; letter-spacing: 2px; display: block;
}
.bpm-slider {
  width: 100%; max-width: 460px;
  accent-color: #C9A84C; display: block; margin: 0 auto; cursor: pointer;
  height: 4px;
}

/* Controls */
.controls { display: flex; justify-content: center; gap: 12px; }
.btn-go {
  padding: clamp(12px, 2.5vh, 16px) clamp(32px, 8vw, 60px);
  border-radius: 10px; border: none; background: #C9A84C; color: #0a0a0a;
  font-size: clamp(15px, 3vw, 18px); font-weight: 700; cursor: pointer;
  font-family: 'DM Sans', sans-serif; letter-spacing: 0.5px;
  transition: background 0.15s, transform 0.1s;
}
.btn-go:hover { background: #d4b85a; }
.btn-go:active { transform: scale(0.98); }
.btn-stp {
  padding: clamp(12px, 2.5vh, 16px) clamp(26px, 7vw, 52px);
  border-radius: 10px; border: 1px solid #333; background: #161616;
  color: #ffffff; font-size: clamp(15px, 3vw, 18px); font-weight: 600;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
}
.btn-stp:hover { background: #222; }

.total-timer {
  text-align: center; font-size: clamp(12px, 2vw, 14px);
  color: #ffffff; font-variant-numeric: tabular-nums;
}
.space-hint { text-align: center; font-size: 11px; color: #aaaaaa; }
.foot { text-align: center; font-size: 10px; color: #444; text-transform: uppercase; letter-spacing: 2px; }

/* Done checkmark animation */
@keyframes dgCheckBounce {
  0%   { transform: scale(0) rotate(-30deg); opacity: 0; }
  50%  { transform: scale(1.4) rotate(8deg);  opacity: 1; }
  75%  { transform: scale(0.9) rotate(-4deg); opacity: 1; }
  100% { transform: scale(1)   rotate(0deg);  opacity: 1; }
}
.done-check {
  display: inline-block;
  animation: dgCheckBounce 0.6s cubic-bezier(.36,.07,.19,.97) both;
  margin-right: 5px;
}
@keyframes dgBadgePulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(102,187,106,0.5); }
  50%       { box-shadow: 0 0 0 10px rgba(102,187,106,0); }
}
.badge-done-anim {
  animation: dgBadgePulse 1.2s ease-in-out 3;
}

/* Navigation */
.nav-row {
  display: flex; align-items: center; justify-content: center; gap: 10px;
}
.nav-btn {
  padding: clamp(10px,2vh,14px) clamp(16px,4vw,28px);
  border-radius: 10px; border: 1px solid #333; background: #161616;
  color: #ffffff; font-size: clamp(13px,2.5vw,16px); font-weight: 600;
  cursor: pointer; font-family: 'DM Sans', sans-serif;
  transition: background 0.15s; white-space: nowrap; flex-shrink: 0;
}
.nav-btn:hover:not(:disabled) { background: #242424; }
.nav-btn:disabled { opacity: 0.25; cursor: default; }
.level-display {
  font-size: clamp(11px,2vw,13px); color: #aaa;
  text-align: center; font-variant-numeric: tabular-nums;
  letter-spacing: 0.3px;
}
.level-display strong { color: #ffffff; font-weight: 600; }
.progress-row {
  display: flex; align-items: center; gap: 8px;
}
.progress-lbl {
  font-size: clamp(9px,1.5vw,11px); color: #555;
  text-transform: uppercase; letter-spacing: 1.5px;
  width: 52px; flex-shrink: 0; text-align: right;
}
.progress-pct {
  font-size: clamp(9px,1.5vw,11px); color: #555;
  width: 32px; flex-shrink: 0; text-align: left;
  font-variant-numeric: tabular-nums;
}
.progress-wrap {
  flex: 1; height: 3px; background: #222; border-radius: 2px; overflow: hidden;
}
.progress-bar {
  height: 100%; background: #C9A84C;
  border-radius: 2px; transition: width 0.5s ease;
  width: 0%;
}
.progress-bar.level-bar { background: #2c5aa3; }
.section-badge {
  text-align: center; font-size: clamp(9px,1.6vw,11px);
  color: #666; text-transform: uppercase; letter-spacing: 2px;
}
</style>
</head>
<body>
<div class="dg-wrap">
  <div class="dg-inner">

    <div class="dg-header">
      <h2 id="dgName">Groove 1</h2>
      <div class="subtitle" id="dgSub">Target: 100 BPM — 3 Blocks</div>
    </div>

    <div class="notation-box">
      <svg id="dgSvg" viewBox="0 0 560 95"></svg>
      <div class="countin-overlay" id="dgCountIn" style="display:none;">
        <div class="countin-number" id="dgCountNum">1</div>
      </div>
    </div>

    <div class="phase-row">
      <span class="phase-badge" id="dgBadge" style="background:rgba(255,255,255,0.05);color:#888;">READY</span>
      <div class="countdown" id="dgCountdown"></div>
    </div>
    <div class="phase-info" id="dgInfo"></div>

    <div id="dgBlocks"></div>

    <div class="nav-row">
      <button class="nav-btn" id="dgNavPrev">← Prev</button>
      <div class="controls" id="dgCtrl" style="flex:1;justify-content:center;">
        <button class="btn-go" id="dgStart">▶ Start</button>
      </div>
      <button class="nav-btn" id="dgNavNext">Next →</button>
    </div>
    <div class="level-display" id="dgLevelDisplay">
      <strong>Level 1</strong>  ·  Chapter 1  ·  Lesson 1
    </div>
    <div class="progress-row">
      <span class="progress-lbl">Chapter</span>
      <div class="progress-wrap"><div class="progress-bar" id="dgChapterBar"></div></div>
      <span class="progress-pct" id="dgChapterPct">0%</span>
    </div>
    <div class="progress-row">
      <span class="progress-lbl">Level</span>
      <div class="progress-wrap"><div class="progress-bar level-bar" id="dgLevelBar"></div></div>
      <span class="progress-pct" id="dgLevelPct">0%</span>
    </div>

    <div class="total-timer" id="dgTotal" style="display:none;"></div>
    <div class="space-hint">Spacebar = Start / Stop</div>

  </div>
</div>

<script>
(function(){

  // ============================================================
  // DRUM KEY — alle Positionen gem. Drumkey von Erwin Eitsen
  // SVG-Koordinaten: Linie 0 = oben, Linie 4 = unten
  // Halbe Zahlen = Zwischenräume, ganze Zahlen = Linien
  // ============================================================
  var DRUM_MAP = {
    kick:        { line: 3.5,  head: 'oval',         sound: 'kick'   }, // Bassdrum 1 — rechter Fuß
    kick2:       { line: 4.0,  head: 'oval',         sound: 'kick'   }, // Bassdrum 2 — linker Fuß
    snare:       { line: 1.5,  head: 'oval',         sound: 'snare'  }, // Snare normal
    snareAccent: { line: 1.5,  head: 'oval',         sound: 'snare', articulation: '>' }, // Snare Accent
    ghost:       { line: 1.5,  head: 'oval-ghost',   sound: 'snare'  }, // Snare Ghostnote
    crossStick:  { line: 1.5,  head: 'x',            sound: 'snare'  }, // Cross Stick
    hh:          { line: -0.5, head: 'x',            sound: 'hh'     }, // Hi-Hat geschlossen
    hhOpen:      { line: -0.5, head: 'x',            sound: 'hh',    articulation: 'o' },
    hhClose:     { line: -0.5, head: 'x',            sound: 'hh',    articulation: '+' },
    hhPedal:     { line: 4.5,  head: 'x',            sound: 'hh'     }, // Hi-Hat Pedal — linker Fuß
    tom1:        { line: 0.5,  head: 'oval',         sound: 'tom1'   },
    tom2:        { line: 1.0,  head: 'oval',         sound: 'tom2'   },
    tom3:        { line: 2.0,  head: 'oval',         sound: 'tom3'   },
    tom4:        { line: 2.5,  head: 'oval',         sound: 'tom4'   },
    crash1:      { line: -1.0, head: 'circledX',     sound: 'crash1', ledger: true },
    crash2:      { line: -1.5, head: 'circledX',     sound: 'crash2', ledger: true },
    ride:        { line: 0.0,  head: 'ovalX',        sound: 'ride'   },
    rideBell:    { line: 0.0,  head: 'triangleRight',sound: 'ride'   },
    cowbell:     { line: 0.5,  head: 'triangleDown', sound: 'cowbell'},
    tambourin:   { line: 1.0,  head: 'triangleRight',sound: 'tambourin'},
    china:       { line: -1.5, head: 'x',            sound: 'china',  ledger: true }
  };

  // ============================================================
  // GROOVE — Basic Rock Beat (8tel-Noten, 2 Takte = 8 Achtel)
  // Jeder Beat = eine Achtel-Note
  // Instrumente pro Beat als Array (alle spielen gleichzeitig)
  // ============================================================
  var GROOVE = {
    name: 'Groove 1',
    beats: [
      // Beat 1
      [{ inst:'kick', line:3.5, head:'oval' },
       { inst:'hh',   line:-0.5, head:'x'  }],
      // Beat &
      [{ inst:'hh',   line:-0.5, head:'x'  }],
      // Beat 2
      [{ inst:'snare',line:1.5, head:'oval' },
       { inst:'hh',   line:-0.5, head:'x'  }],
      // Beat &
      [{ inst:'hh',   line:-0.5, head:'x'  }],
      // Beat 3
      [{ inst:'kick', line:3.5, head:'oval' },
       { inst:'hh',   line:-0.5, head:'x'  }],
      // Beat &
      [{ inst:'hh',   line:-0.5, head:'x'  }],
      // Beat 4
      [{ inst:'snare',line:1.5, head:'oval' },
       { inst:'hh',   line:-0.5, head:'x'  }],
      // Beat &
      [{ inst:'hh',   line:-0.5, head:'x'  }]
    ]
  };

  // ============================================================
  // EXERCISE LIBRARY
  // ============================================================

  // Alle Übungen — beats:null = aktueller GROOVE wird verwendet
  // beats:[...] = eigene Notation (wird nach Definition gesetzt)
  // ============================================================
  // SPHM — Strokes Per Hand Per Minute (Drumlion Difficulty Metric)
  // ============================================================
  // SPHM = BPM × noteValueFactor × handFactor
  //   noteValue:  quarter=1, eighth=2, sixteenth=4, triplet=3
  //   hihatHands: one=1.0,  alternate=0.5
  //
  // Example: 8th-note groove, one hand,    100 BPM  →  SPHM = 100 × 2 × 1.0 = 200
  //          16th-note fill,  alternating, 100 BPM  →  SPHM = 100 × 4 × 0.5 = 200
  //          16th-note groove,one hand,    100 BPM  →  SPHM = 100 × 4 × 1.0 = 400
  // ============================================================

  // noteValue factors — strokes per quarter-note beat
  var NOTE_FACTORS = {
    whole:             0.25,  // ganze Note          (1 per 4 beats)
    half:              0.5,   // halbe Note           (1 per 2 beats)
    quarter:           1,     // Viertel              (1 per beat)
    quarterTriplet:    1.5,   // Vierteltriole        (3 per 2 beats)
    eighth:            2,     // Achtel               (2 per beat)
    eighthTriplet:     3,     // Achteltriole         (3 per beat)
    sixteenth:         4,     // 16tel                (4 per beat)
    quintuplet:        5,     // Quintole             (5 per beat)
    sixteenthTriplet:  6,     // 16tel-Triole/Sextole (6 per beat)
    septuplet:         7,     // Septole              (7 per beat)
    thirtySecond:      8      // 32tel                (8 per beat)
  };

  function spmFactor(ex) {
    var nv = NOTE_FACTORS[ex.noteValue] || 2;
    var hf = (ex.hihatHands === 'one') ? 1.0 : 0.5;
    return nv * hf;
  }
  function sphmToBpm(sphm, ex, step) {
    return Math.round((sphm / spmFactor(ex)) / step) * step;
  }
  function bpmToSphm(bpm, ex) {
    return Math.round(bpm * spmFactor(ex));
  }

  // ── COURSE SPHM RANGE ───────────────────────────────────────
  var COURSE_MIN_SPHM = 120;   // comfortable beginner pace
  var COURSE_MAX_SPHM = 400;   // advanced / near-limit

  // ============================================================
  // LEVEL / CHAPTER / LESSON SYSTEM
  // ============================================================
  // 100 Levels × 100h each = 10.000h total
  // 10 Chapters per Level × 10h each
  // ============================================================
  var HOURS_PER_LEVEL   = 100;
  var HOURS_PER_CHAPTER = 10;
  var _timeKey    = 'drumlion_v1_totalMinutes';
  var _lessonsKey = 'drumlion_v1_totalLessons';

  function _getTotalMinutes()  { return parseFloat(localStorage.getItem(_timeKey)    || '0'); }
  function _getTotalLessons()  { return parseInt(  localStorage.getItem(_lessonsKey) || '0'); }

  function _addLessonTime(mins) {
    var prevHours = _getTotalMinutes() / 60;
    var newMins   = _getTotalMinutes() + mins;
    var newHours  = newMins / 60;
    var lessons   = _getTotalLessons() + 1;
    try {
      localStorage.setItem(_timeKey,    String(newMins));
      localStorage.setItem(_lessonsKey, String(lessons));
    } catch(e) {}
    // detect chapter / level crossings
    var prevChapter = Math.floor(prevHours / HOURS_PER_CHAPTER);
    var newChapter  = Math.floor(newHours  / HOURS_PER_CHAPTER);
    var prevLevel   = Math.floor(prevHours / HOURS_PER_LEVEL);
    var newLevel    = Math.floor(newHours  / HOURS_PER_LEVEL);
    if (newLevel > prevLevel)        return 'level';
    if (newChapter > prevChapter)    return 'chapter';
    return null;
  }

  function _getLevelInfo() {
    var totalMins  = _getTotalMinutes();
    var totalHours = totalMins / 60;
    var level      = Math.min(100, Math.floor(totalHours / HOURS_PER_LEVEL) + 1);
    var chapter    = Math.min(10,  Math.floor((totalHours % HOURS_PER_LEVEL) / HOURS_PER_CHAPTER) + 1);
    var levelPct   = ((totalHours % HOURS_PER_LEVEL)   / HOURS_PER_LEVEL)   * 100;
    var chapterPct = ((totalHours % HOURS_PER_CHAPTER) / HOURS_PER_CHAPTER) * 100;
    var lessons    = _getTotalLessons() + 1;
    return { level: level, chapter: chapter, levelPct: levelPct, chapterPct: chapterPct, lessons: lessons };
  }

  function _updateLevelUI() {
    var info = _getLevelInfo();
    var el = document.getElementById('dgLevelDisplay');
    if (el) el.innerHTML =
      '<strong>Level ' + info.level + '</strong>  ·  Chapter ' + info.chapter + '  ·  Lesson ' + info.lessons;
    var cb = document.getElementById('dgChapterBar');
    var lb = document.getElementById('dgLevelBar');
    var cp = document.getElementById('dgChapterPct');
    var lp = document.getElementById('dgLevelPct');
    if (cb) cb.style.width = info.chapterPct.toFixed(1) + '%';
    if (lb) lb.style.width = info.levelPct.toFixed(1)   + '%';
    if (cp) cp.textContent = Math.round(info.chapterPct) + '%';
    if (lp) lp.textContent = Math.round(info.levelPct)   + '%';
  }

  // Calculate actual lesson duration from blocks + pauses (in minutes)
  function _lessonDurationMinutes() {
    var secs = 0;
    if (typeof blocks !== 'undefined') blocks.forEach(function(b) { secs += b.dur; });
    if (typeof pauses !== 'undefined') pauses.forEach(function(p) { if (p) secs += p; });
    return secs / 60;
  }

  // ── EXERCISES ───────────────────────────────────────────────
  // noteValue   : 'quarter' | 'eighth' | 'sixteenth' | 'triplet'
  // hihatHands  : 'one' | 'alternate'
  // minSPHM/maxSPHM : Strokes Per Hand Per Minute difficulty range
  // step        : BPM step size
  // beats       : null = default GROOVE; array = custom notation
  // ─────────────────────────────────────────────────────────────
  var EXERCISES = [
    // ── GROOVES (1–20) ──────────────────────────────────────────
    // noteValue:'eighth', hihatHands:'one' (SPHM factor 2.0)
    // Groove N: minBpm=5*ceil((29+N)/5), maxBpm=250
    {id:1, cat:'grooves', name:'Groove 1', noteValue:'eighth', hihatHands:'one', minSPHM:60, maxSPHM:500, step:5, beats:[
          [{inst:'kick',line:3.5,head:'oval'},{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'snare',line:1.5,head:'oval'},{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'kick',line:3.5,head:'oval'},{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'snare',line:1.5,head:'oval'},{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'hh',line:-0.5,head:'x'}]
        ]},
    {id:2, cat:'grooves', name:'Groove 2', noteValue:'eighth', hihatHands:'one', minSPHM:70, maxSPHM:500, step:5, beats:[
          [{inst:'kick',line:3.5,head:'oval'},{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'snare',line:1.5,head:'oval'},{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'kick',line:3.5,head:'oval'},{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'kick',line:3.5,head:'oval'},{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'snare',line:1.5,head:'oval'},{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'hh',line:-0.5,head:'x'}]
        ]},
    {id:3, cat:'grooves', name:'Groove 3', noteValue:'eighth', hihatHands:'one', minSPHM:70, maxSPHM:500, step:5, beats:[
          [{inst:'kick',line:3.5,head:'oval'},{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'snare',line:1.5,head:'oval'},{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'kick',line:3.5,head:'oval'},{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'kick',line:3.5,head:'oval'},{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'snare',line:1.5,head:'oval'},{inst:'hh',line:-0.5,head:'x'}],
          [{inst:'hh',line:-0.5,head:'x'}]

  // COURSE DISTRIBUTION ALGORITHM
  // ============================================================
  // • 3 Start-Übungen (G1, F1, R1), danach +1 alle 20 Lektionen
  // • Boost-Sequenz: Lücke nach n Auftritten = n Lektionen
  // • Steady-State: ~31 Übungen gleichzeitig aktiv
  // • Übungen graduieren nach letztem BPM-Schritt
  // • Einführungsreihenfolge: G → F → R → G → F → R → ...
  // ============================================================

  var INTRO_INTERVAL = 20;   // neue Übung alle N Lektionen
  var START_COUNT    = 1;    // G1 startet sofort (weitere Kategorien folgen wenn Content da)
  var COURSE_KEY     = 'drumlion_v2_course';

  // Einführungsreihenfolge: nur Grooves (Fill Ins / Rudiments folgen wenn Content geliefert)
  function _buildIntroQueue() {
    return EXERCISES.filter(function(e){ return e.cat === 'grooves'; });
  }
  var _introQueue = _buildIntroQueue();

  // Navigations-History für Prev/Next
  var _navHistory = [];
  var _navPos     = -1;

  // Anzahl BPM-Schritte für eine Übung
  function _exSteps(ex) {
    var minB = sphmToBpm(ex.minSPHM, ex, ex.step);
    var maxB = sphmToBpm(ex.maxSPHM, ex, ex.step);
    return Math.max(1, Math.round((maxB - minB) / ex.step) + 1);
  }

  // BPM für einen bestimmten Schritt-Index
  function _exBpm(ex, stepIdx) {
    return sphmToBpm(ex.minSPHM, ex, ex.step) + stepIdx * ex.step;
  }

  // Initial State aufbauen
  function _initState() {
    var active = _introQueue.slice(0, START_COUNT).map(function(ex) {
      return {id: ex.id, bpmStep: 0, appearances: 0, lessonsDue: 0};
    });
    return {active: active, total: 0, nextIntro: INTRO_INTERVAL, introIdx: START_COUNT, reps: {}};
  }

  function _loadState() {
    try {
      var s = localStorage.getItem(COURSE_KEY);
      if (s) { var p = JSON.parse(s); if (p && p.active) return p; }
    } catch(e) {}
    return _initState();
  }

  function _saveState() {
    try { localStorage.setItem(COURSE_KEY, JSON.stringify(_cState)); } catch(e) {}
  }

  var _cState = _loadState();

  // Nächste Lektion ermitteln (ohne State zu ändern)
  function _peekLesson() {
    if (!_cState.active.length) return null;
    var sorted = _cState.active.slice().sort(function(a,b) {
      if (a.lessonsDue !== b.lessonsDue) return a.lessonsDue - b.lessonsDue;
      if (a.appearances !== b.appearances) return a.appearances - b.appearances;
      return a.id - b.id;
    });
    var entry = sorted[0];
    var ex    = EXERCISES.find(function(e){ return e.id === entry.id; });
    if (!ex) return null;
    var bpm   = _exBpm(ex, entry.bpmStep);
    return {ex: ex, bpm: bpm, sphm: bpmToSphm(bpm, ex), entry: entry};
  }

  // Lektion abschließen: State vorwärts
  function _advanceState() {
    var lesson = _peekLesson();
    if (!lesson) return;
    var id    = lesson.entry.id;
    var entry = _cState.active.find(function(e){ return e.id === id; });

    entry.appearances++;
    entry.bpmStep++;
    entry.lessonsDue = entry.appearances;   // Lücke wächst mit jeder Wiederholung

    // Wiederholungszähler pro Übung
    if (!_cState.reps) _cState.reps = {};
    _cState.reps[id] = (_cState.reps[id] || 0) + 1;

    // Graduation: alle BPM-Schritte gespielt
    if (entry.bpmStep >= _exSteps(lesson.ex)) {
      _cState.active = _cState.active.filter(function(e){ return e.id !== id; });
    }

    // Alle anderen Übungen: Lücke -1
    _cState.active.forEach(function(e) {
      if (e.id !== id) e.lessonsDue = Math.max(0, e.lessonsDue - 1);
    });

    _cState.total++;

    // Neue Übung einführen wenn fällig
    while (_cState.total >= _cState.nextIntro && _cState.introIdx < _introQueue.length) {
      var newEx = _introQueue[_cState.introIdx];
      _cState.active.push({id: newEx.id, bpmStep: 0, appearances: 0, lessonsDue: 0});
      _cState.introIdx++;
      _cState.nextIntro += INTRO_INTERVAL;
    }

    _saveState();
  }

  // Navigation History: Übung in History pushen
  function _pushHistory(lesson) {
    _navHistory = _navHistory.slice(0, _navPos + 1);
    _navHistory.push({id: lesson.entry.id, bpmStep: lesson.entry.bpmStep, bpm: lesson.bpm});
    _navPos = _navHistory.length - 1;
  }

  // Nav-Buttons Sichtbarkeit aktualisieren
  function _updateNavButtons() {
    var prev = document.getElementById('dgNavPrev');
    var next = document.getElementById('dgNavNext');
    if (prev) { prev.style.visibility = 'visible'; prev.disabled = (_navPos <= 0); }
    if (next) {
      next.style.visibility = 'visible';
      next.textContent = (_navPos < _navHistory.length - 1) ? 'Next →' : 'Skip →';
    }
  }

  // Aus History-Position laden (ohne State zu ändern)
  function _loadHistoryLesson(pos, autoStart) {
    if (playing) stopExercise();
    var h  = _navHistory[pos];
    if (!h) return;
    var ex = EXERCISES.find(function(e){ return e.id === h.id; });
    if (!ex) return;
    _navPos = pos;
    tBpm = h.bpm;
    if (ex.beats) GROOVE.beats = ex.beats;
    document.getElementById('dgName').textContent = ex.name;
    _updateNavButtons();
    updateBpm();
    if (autoStart) setTimeout(startExercise, 80);
  }

  // Aktuelle Lektion in den Player laden
  function _loadCurrentLesson(autoStart) {
    if (playing) stopExercise();
    var lesson = _peekLesson();
    if (!lesson) return;
    tBpm = lesson.bpm;
    if (lesson.ex.beats) GROOVE.beats = lesson.ex.beats;
    document.getElementById('dgName').textContent = lesson.ex.name;
    _pushHistory(lesson);
    _updateCourseUI();
    updateBpm();
    if (autoStart) setTimeout(startExercise, 80);
  }

  function getBarsFromBase(bpm, baseDur) {
    // Rohe Takte bei baseDur Sekunden, auf nächste 4 Takte aufrunden
    var rawBars = bpm * baseDur / 60 / 4;
    return Math.ceil(rawBars / 4) * 4;
  }

  function getBlocks(t) {
    var bpms, baseDurs;
    // Block-BPMs und Basis-Dauern direkt aus Speed Tabelle
    if      (t <= 50)  { bpms=[t];                        baseDurs=[30];             }
    else if (t <= 70)  { bpms=[t];                        baseDurs=[40];             }
    else if (t <= 80)  { bpms=[t];                        baseDurs=[50];             }
    else if (t <= 90)  { bpms=[t-10,t];                   baseDurs=[50,60];          }
    else if (t <= 100) { bpms=[t-20,t-10,t];              baseDurs=[40,50,60];       }
    else if (t <= 110) { bpms=[t-30,t-20,t-10,t];         baseDurs=[30,40,50,60];    }
    else if (t <= 160) { bpms=[t-40,t-30,t-20,t-10,t];   baseDurs=[20,30,40,50,60]; }
    else if (t <= 200) { var r=RAW_161[t-161]; bpms=[r[0],r[1],r[2],r[3],t]; baseDurs=[20,30,40,50,60]; }
    else if (t <= 250) { var r=RAW_201[t-201]; bpms=[r[0],r[1],r[2],r[3],t]; baseDurs=[20,30,40,50,60]; }
    else               { bpms=[t-120,t-90,t-60,t-30,t];  baseDurs=[20,30,40,50,60]; }

    return bpms.map(function(b, i) {
      var bars = getBarsFromBase(b, baseDurs[i]);
      var dur  = bars * 4 * 60 / b;
      return { bpm: b, bars: bars, dur: dur };
    });
  }

    if (t <= 250) return [10,15,20,25];
    return [15,20,25,30];
  }

  function b64ToArrayBuffer(b64) {
    var bin = atob(b64);
    var buf = new ArrayBuffer(bin.length);
    var view = new Uint8Array(buf);
    for (var i = 0; i < bin.length; i++) view[i] = bin.charCodeAt(i);
    return buf;
  }

  function loadWavs() {
    Object.keys(WAV_B64).forEach(function(k) {
      (function(key) {
        var ab = b64ToArrayBuffer(WAV_B64[key]);
        aCtx.decodeAudioData(ab, function(buf) {
          WAVS[key] = buf;
        }, function() {});
      })(k);
    });
  }

  function playBuf(buf, vol) {
    if (!buf || !aCtx) return false;
    var src = aCtx.createBufferSource(), g = aCtx.createGain();
    src.buffer = buf; g.gain.value = vol !== undefined ? vol : 1.0;
    src.connect(g); g.connect(aCtx.destination);
    src.start(aCtx.currentTime); return true;
  }

  function playKick() {
    if (!aCtx) return;
    if (playBuf(WAVS.kick, 1.0)) return;
    var o = aCtx.createOscillator(), g = aCtx.createGain();
    o.connect(g); g.connect(aCtx.destination);
    o.frequency.setValueAtTime(160, aCtx.currentTime);
    o.frequency.exponentialRampToValueAtTime(40, aCtx.currentTime + 0.12);
    g.gain.setValueAtTime(0.8, aCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, aCtx.currentTime + 0.25);
    o.type = 'sine'; o.start(aCtx.currentTime); o.stop(aCtx.currentTime + 0.25);
  }

  function playSnare() {
    if (!aCtx) return;
    if (playBuf(WAVS.snare, 1.0)) return;
    var sz = aCtx.sampleRate * 0.1, buf = aCtx.createBuffer(1, sz, aCtx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < sz; i++) d[i] = (Math.random() * 2 - 1) * 0.5;
    var n = aCtx.createBufferSource(); n.buffer = buf;
    var gn = aCtx.createGain();
    gn.gain.setValueAtTime(0.6, aCtx.currentTime);
    gn.gain.exponentialRampToValueAtTime(0.001, aCtx.currentTime + 0.12);
    var o = aCtx.createOscillator(), go = aCtx.createGain();
    o.frequency.value = 200; o.type = 'triangle';
    go.gain.setValueAtTime(0.4, aCtx.currentTime);
    go.gain.exponentialRampToValueAtTime(0.001, aCtx.currentTime + 0.08);
    n.connect(gn); gn.connect(aCtx.destination);
    o.connect(go); go.connect(aCtx.destination);
    n.start(aCtx.currentTime); o.start(aCtx.currentTime); o.stop(aCtx.currentTime + 0.08);
  }

  function playHiHat() {
    if (!aCtx) return;
    if (playBuf(WAVS.hh, 0.8)) return;
    var sz = aCtx.sampleRate * 0.05, buf = aCtx.createBuffer(1, sz, aCtx.sampleRate);
    var d = buf.getChannelData(0);
    for (var i = 0; i < sz; i++) d[i] = (Math.random() * 2 - 1) * 0.3;
    var n = aCtx.createBufferSource(); n.buffer = buf;
    var g = aCtx.createGain();
    g.gain.setValueAtTime(0.25, aCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, aCtx.currentTime + 0.04);
    var hp = aCtx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 7000;
    n.connect(hp); hp.connect(g); g.connect(aCtx.destination);
    n.start(aCtx.currentTime);
  }

  function playCountClick(accent) {
    if (!aCtx) return;
    var o = aCtx.createOscillator(), g = aCtx.createGain();
    o.connect(g); g.connect(aCtx.destination);
    o.frequency.value = accent ? 1500 : 1100;
    g.gain.setValueAtTime(0.35, aCtx.currentTime);
    g.gain.exponentialRampToValueAtTime(0.001, aCtx.currentTime + 0.06);
    o.type = 'sine'; o.start(aCtx.currentTime); o.stop(aCtx.currentTime + 0.06);
  }

  function playBeat(bi) {
    GROOVE.beats[bi].forEach(function(n) {
      if      (n.inst === 'kick')  playKick();
      else if (n.inst === 'snare') playSnare();
      else if (n.inst === 'hh')    playHiHat();
    });
  }

  // ============================================================
  // NOTATION — SVG Rendering
  // sY=40: y-Position der obersten Notenlinie
  // ls=8:  Abstand zwischen Notenlinien
  // Linie N: y = sY + N * ls
  // ============================================================
  function drawLedgerLines(noteLine, x, color, opacity) {
    var h = '';
    var ls = 8, sY = 40;
    // Hilfslinien ÜBER dem System (line < 0, ganzzahlig ab -1)
    if (noteLine < 0) {
      var topLedger = Math.ceil(noteLine); // z.B. -0.5→0, -1→-1, -1.5→-1
      for (var ll = -1; ll >= topLedger; ll--) {
        h += '<line x1="'+(x-9)+'" y1="'+(sY+ll*ls)+'" x2="'+(x+9)+'" y2="'+(sY+ll*ls)+
             '" stroke="'+color+'" stroke-width="0.9" opacity="'+opacity+'"/>';
      }
    }
    // Hilfslinien UNTER dem System (line > 4, ganzzahlig ab 5)
    if (noteLine > 4) {
      var botLedger = Math.floor(noteLine); // z.B. 4.5→4, 5→5
      for (var ll = 5; ll <= botLedger; ll++) {
        h += '<line x1="'+(x-9)+'" y1="'+(sY+ll*ls)+'" x2="'+(x+9)+'" y2="'+(sY+ll*ls)+
             '" stroke="'+color+'" stroke-width="0.9" opacity="'+opacity+'"/>';
      }
    }
    return h;
  }

  function drawNoteHead(n, x, y, color, opacity) {
    var h = '';
    var head = n.head || 'oval';
    if (head === 'x') {
      // × Kreuz (Hi-Hat, Cross Stick, Hi-Hat Pedal, China)
      h += '<line x1="'+(x-4)+'" y1="'+(y-4)+'" x2="'+(x+4)+'" y2="'+(y+4)+
           '" stroke="'+color+'" stroke-width="2" opacity="'+opacity+'"/>';
      h += '<line x1="'+(x+4)+'" y1="'+(y-4)+'" x2="'+(x-4)+'" y2="'+(y+4)+
           '" stroke="'+color+'" stroke-width="2" opacity="'+opacity+'"/>';
    } else if (head === 'circledX') {
      // ⊗ Kreis mit × (Crash 1, Crash 2)
      h += '<circle cx="'+x+'" cy="'+y+'" r="5" fill="none" stroke="'+color+
           '" stroke-width="1.4" opacity="'+opacity+'"/>';
      h += '<line x1="'+(x-3.5)+'" y1="'+(y-3.5)+'" x2="'+(x+3.5)+'" y2="'+(y+3.5)+
           '" stroke="'+color+'" stroke-width="1.4" opacity="'+opacity+'"/>';
      h += '<line x1="'+(x+3.5)+'" y1="'+(y-3.5)+'" x2="'+(x-3.5)+'" y2="'+(y+3.5)+
           '" stroke="'+color+'" stroke-width="1.4" opacity="'+opacity+'"/>';
    } else if (head === 'ovalX') {
      // Ovale Ellipse mit × (Ride)

      h += '<line x1="'+(x-3)+'" y1="'+(y-2)+'" x2="'+(x+3)+'" y2="'+(y+2)+
           '" stroke="'+color+'" stroke-width="1.4" opacity="'+opacity+'"/>';
      h += '<line x1="'+(x+3)+'" y1="'+(y-2)+'" x2="'+(x-3)+'" y2="'+(y+2)+

      h += '<ellipse cx="'+x+'" cy="'+y+'" rx="4" ry="2.8" fill="'+color+
           '" transform="rotate(-15 '+x+' '+y+')" opacity="'+opacity+'"/>';

    } else {
      // Standard ovaler Kopf (Snare, Kick, Toms, ...)
      h += '<ellipse cx="'+x+'" cy="'+y+'" rx="5" ry="3.5" fill="'+color+
           '" transform="rotate(-15 '+x+' '+y+')" opacity="'+opacity+'"/>';
    }
    return h;
  }

  function renderNot(curBeat, dimmed) {
    var svg  = document.getElementById('dgSvg');
    var lbl  = ['1', '&', '2', '&', '3', '&', '4', '&'];
    var sY   = 40, ls = 8, sX = 42, bs = 60, bW = bs * 8;
    var op   = dimmed ? 0.2 : 1;
    var W    = '#ffffff';
    var A    = '#5b8fd9'; // aktiver Beat: Drumlion-Blau
    var h    = '';

    // ── 5 Notenlinien ──
    for (var i = 0; i < 5; i++)
      h += '<line x1="'+(sX-10)+'" y1="'+(sY+i*ls)+'" x2="'+(sX+bW+10)+'" y2="'+(sY+i*ls)+
           '" stroke="'+W+'" stroke-width="0.7" opacity="'+op+'"/>';

    // ── Wiederholungszeichen links ──
    h += '<line x1="'+(sX-10)+'" y1="'+sY+'" x2="'+(sX-10)+'" y2="'+(sY+4*ls)+
         '" stroke="'+W+'" stroke-width="2.5" opacity="'+op+'"/>';
    h += '<line x1="'+(sX-5)+'" y1="'+sY+'" x2="'+(sX-5)+'" y2="'+(sY+4*ls)+
         '" stroke="'+W+'" stroke-width="0.8" opacity="'+op+'"/>';
    h += '<circle cx="'+sX+'" cy="'+(sY+1.3*ls)+'" r="2" fill="'+W+'" opacity="'+op+'"/>';
    h += '<circle cx="'+sX+'" cy="'+(sY+2.7*ls)+'" r="2" fill="'+W+'" opacity="'+op+'"/>';

    // ── Wiederholungszeichen rechts ──
    h += '<line x1="'+(sX+bW+10)+'" y1="'+sY+'" x2="'+(sX+bW+10)+'" y2="'+(sY+4*ls)+
         '" stroke="'+W+'" stroke-width="2.5" opacity="'+op+'"/>';
    h += '<line x1="'+(sX+bW+5)+'" y1="'+sY+'" x2="'+(sX+bW+5)+'" y2="'+(sY+4*ls)+
         '" stroke="'+W+'" stroke-width="0.8" opacity="'+op+'"/>';
    h += '<circle cx="'+(sX+bW)+'" cy="'+(sY+1.3*ls)+'" r="2" fill="'+W+'" opacity="'+op+'"/>';
    h += '<circle cx="'+(sX+bW)+'" cy="'+(sY+2.7*ls)+'" r="2" fill="'+W+'" opacity="'+op+'"/>';

    // ── Balken (alle Hälse nach oben) ──
    [[0,1],[2,3],[4,5],[6,7]].forEach(function(g) {
      var x1 = sX+16+g[0]*bs+5, x2 = sX+16+g[1]*bs+5;
      h += '<line x1="'+x1+'" y1="'+(sY-18)+'" x2="'+x2+'" y2="'+(sY-18)+
           '" stroke="'+W+'" stroke-width="2.5" opacity="'+op+'"/>';
    });

    // ── Noten pro Beat ──
    GROOVE.beats.forEach(function(bn, bi) {
      var x   = sX + 16 + bi * bs;
      var isA = (curBeat === bi && !dimmed);
      var nc  = isA ? A : W;
      var lc  = isA ? A : (dimmed ? 'rgba(255,255,255,0.2)' : 'rgba(255,255,255,0.6)');

      // Beat-Highlight
      if (isA) h += '<rect x="'+(x-14)+'" y="'+(sY-23)+'" width="28" height="'+(7*ls+16)+
                    '" rx="4" fill="#1a3d6e" opacity="0.35"/>';

      // Zählzeit-Label
      h += '<text x="'+x+'" y="'+(sY-27)+'" text-anchor="middle" fill="'+lc+
           '" font-size="11" font-family="DM Sans,sans-serif" font-weight="'+(isA?700:400)+'">'+lbl[bi]+'</text>';

      // Hilfslinien für alle Noten dieses Beats
      bn.forEach(function(n) {
        h += drawLedgerLines(n.line, x, nc, op);
      });

      // Notenköpfe zeichnen
      bn.forEach(function(n) {
        var y = sY + n.line * ls;
        h += drawNoteHead(n, x, y, nc, op);
      });

      // Hals nach oben: von der tiefsten Note bis zum Balken
      var maxLine = Math.max.apply(null, bn.map(function(n) { return n.line; }));
      var stemBot = sY + maxLine * ls;
      h += '<line x1="'+(x+5)+'" y1="'+stemBot+'" x2="'+(x+5)+'" y2="'+(sY-18)+
           '" stroke="'+nc+'" stroke-width="1.2" opacity="'+op+'"/>';
    });

    svg.innerHTML = h;
  }

  // ============================================================
  // BLOCKS BAR
  // ============================================================
  function renderBlocksBar() {
    var h = '<div class="blocks-bar">';
    blocks.forEach(function(b, i) {
      var bg, bc, tc;
      if (i < bIdx) {
        bg='#2c5aa3'; bc='#2c5aa3'; tc='#E8E4DB';
      } else if (i === bIdx && (phase==='playing' || phase==='countIn')) {
        bg = phase==='countIn' ? 'rgba(201,168,76,0.25)' : '#2c5aa3';
        bc = phase==='countIn' ? '#C9A84C' : '#2c5aa3'; tc='#E8E4DB';
      } else {
        bg='#161616'; bc='#2a2a2a'; tc='#aaa';
      }
      h += '<div class="block-seg" style="flex:'+Math.round(b.dur)+';background:'+bg+';border-color:'+bc+';">';
      h += '<span class="b-bpm" style="color:'+tc+'">'+b.bpm+' bpm</span>';
      h += '<span class="b-dur" style="color:'+tc+'">'+b.bars+' bars</span></div>';
      if (i < blocks.length-1 && pauses[i]) {
        var pa = (i===bIdx-1 && phase==='pause');
        h += '<div class="pause-seg" style="color:'+(pa?'#C9A84C':'#666')+'">'+pauses[i]+'s</div>';
      }
    });
    h += '</div>';
    document.getElementById('dgBlocks').innerHTML = h;
  }

  // ============================================================
  // UI HELPERS
  // ============================================================
  function setBadge(p) {
    var el = document.getElementById('dgBadge');
    var s = {
      idle:    { bg:'rgba(255,255,255,0.05)', c:'#888',    t:'READY' },
      countIn: { bg:'rgba(201,168,76,0.15)',  c:'#C9A84C', t:'COUNT IN' },
      playing: { bg:'rgba(44,90,163,0.2)',    c:'#5b8fd9', t:'BLOCK '+(bIdx+1)+'/'+blocks.length },
      pause:   { bg:'rgba(201,168,76,0.1)',   c:'#888',    t:'PAUSE' },
      done:    { bg:'rgba(76,175,80,0.15)',   c:'#66bb6a', t:'DONE!', html:'<span class="done-check">✔</span>DONE!' }
    }[p] || { bg:'rgba(255,255,255,0.05)', c:'#888', t:'READY' };
    el.style.background = s.bg; el.style.color = s.c;
    if (s.html) { el.innerHTML = s.html; el.classList.add('badge-done-anim'); }
    else { el.textContent = s.t; el.classList.remove('badge-done-anim'); }
  }

  function setInfo(txt) { document.getElementById('dgInfo').textContent = txt; }

  function setCountdown(secs) {
    var el = document.getElementById('dgCountdown');
    if (secs <= 0) { el.textContent = '0s'; return; }
    var r = Math.ceil(secs);
    if (r >= 60) {
      var m = Math.floor(r/60), s = r%60;
      el.textContent = m+':'+(s<10?'0':'')+s;
    } else {
      el.textContent = r+'s';
    }
  }

  function showCountIn(content) {
    var ov  = document.getElementById('dgCountIn');
    var nm  = document.getElementById('dgCountNum');
    var isRest = (content === null || content === undefined);
    ov.style.display = 'flex';
    nm.textContent   = isRest ? '·' : String(content);
    nm.style.opacity = isRest ? '0.15' : '1';
    if (!isRest) {
      nm.style.animation = 'none';
      nm.offsetHeight;
      nm.style.animation = 'dgPulse 0.28s ease-out';
    }
  }
  function hideCountIn() { document.getElementById('dgCountIn').style.display = 'none'; }

  // ============================================================
  // FRAUENSTIMME — Pre-recorded via AudioContext (tight timing)
  // ============================================================
  function playCountVoice(num) {
    if (!aCtx) return;
    var key = 'count' + num;
    if (!WAVS[key]) return;
    var src = aCtx.createBufferSource();
    src.buffer = WAVS[key];
    src.connect(aCtx.destination);
    src.start(aCtx.currentTime);
  }

  function updateBpm() {
    blocks = getBlocks(tBpm);
    pauses = getPauses(tBpm, blocks.length);
    var _curLesson = (typeof _peekLesson === 'function') ? _peekLesson() : null;
    var _sphmStr = _curLesson ? '  ·  '+_curLesson.sphm+' SPHM' : '';
    var _repStr = '';
    if (_curLesson && typeof _cState !== 'undefined' && _cState.reps) {
      var _r = _cState.reps[_curLesson.entry.id] || 0;
      _repStr = _r === 0 ? '  ·  First time 🎯' : '  ·  Played '+_r+'×';
    }
    document.getElementById('dgSub').textContent =
      tBpm+' BPM'+_sphmStr+' — '+blocks.length+' Block'+(blocks.length>1?'s':'')+_repStr;
    bIdx=0; phase='idle';
    renderBlocksBar(); setBadge('idle'); setInfo(''); setCountdown(0);
    renderNot(-1, false);
    if (typeof _updateCourseUI === 'function') _updateCourseUI();
  }

  // ============================================================
  // GESAMT-TIMER
  // ============================================================
  var totalStart=0, totalInt=null;
  function startTotal() {
    totalStart = Date.now();
    var el = document.getElementById('dgTotal'); el.style.display='block';
    totalInt = setInterval(function() {
      var e = (Date.now()-totalStart)/1000;
      el.textContent = 'Total: '+String(Math.floor(e/60)).padStart(2,'0')+':'+String(Math.floor(e%60)).padStart(2,'0');
    }, 500);
  }
  function stopTotal() {
    if (totalInt) clearInterval(totalInt);
    document.getElementById('dgTotal').style.display='none';
  }

  // ============================================================
  // STATE
  // ============================================================
  // BPM + Groove aus URL lesen
  var _params  = new URLSearchParams(window.location.search);
  var tBpm     = Math.min(300, Math.max(30, parseInt(_params.get('bpm'))  || 100));
  var grooveId = parseInt(_params.get('groove')) || 1;
  var _gName   = 'Groove ' + grooveId;

  // Header direkt setzen
  document.getElementById('dgName').textContent = _gName;

  var playing=false, intId=null;
  var blocks=[], pauses=[], bIdx=0, beat=0, bar=0, phase='idle';

  // ============================================================
  // PLAYBACK
  // ============================================================
  function startExercise() {
    initA();
    blocks  = getBlocks(tBpm);
    pauses  = getPauses(tBpm, blocks.length);
    bIdx=0; beat=0; bar=0; playing=true; phase='countIn';
    document.getElementById('dgCtrl').innerHTML = '<button class="btn-stp" id="dgStop">■ Stop</button>';
    document.getElementById('dgStop').addEventListener('click', stopExercise);
    renderBlocksBar(); renderNot(-1, true); startTotal(); startCountIn();
  }

  // Vorzähler: ab 60 BPM = 2 Takte (8 Viertel), unter 60 BPM = 1 Takt (4 Viertel)
  function startCountIn() {
    phase='countIn'; setBadge('countIn'); setInfo('Get ready…');
    var bpm    = blocks[bIdx].bpm;
    var beatMs = (60 / bpm) * 1000;

    var seq;
    if (bpm >= 60) {
      seq = [
        { num:'1',  click:true,  accent:true  }, // Takt 1: 1
        { num:null, click:false               }, //          Viertelpause
        { num:'2',  click:true,  accent:false }, //          2
        { num:null, click:false               }, //          Viertelpause
        { num:'1',  click:true,  accent:true  }, // Takt 2: 1
        { num:'2',  click:true,  accent:false }, //          2
        { num:'3',  click:true,  accent:false }, //          3
        { num:'4',  click:true,  accent:false }  //          4
      ];
    } else {
      seq = [
        { num:'1',  click:true,  accent:true  },
        { num:'2',  click:true,  accent:false },
        { num:'3',  click:true,  accent:false },
        { num:'4',  click:true,  accent:false }
      ];
    }

    var ci = 0;
    showCountIn(seq[0].num);
    if (seq[0].click) playCountClick(seq[0].accent);
    if (seq[0].num) playCountVoice(seq[0].num);

    if (intId) clearInterval(intId);
    intId = setInterval(function() {
      if (!playing) return;
      ci++;
      if (ci >= seq.length) {
        clearInterval(intId);
        hideCountIn();
        startPlaying();
      } else {
        var s = seq[ci];
        showCountIn(s.num);
        if (s.click) playCountClick(s.accent);
        if (s.num) playCountVoice(s.num);
      }
    }, beatMs);
  }

  function startPlaying() {
    phase='playing'; setBadge('playing'); beat=0; bar=0;
    renderBlocksBar();

    var cb            = blocks[bIdx];
    var isTimingBlock = (cb.bpm >= 60);       // Timing Training ab 60 BPM
    var totalBars     = cb.bars;
    var eighthMs      = (60 / cb.bpm / 2) * 1000;
    var eighthsLeft   = totalBars * 8;

    // Timing-Training: Takte 1-8 voller Groove, dann 2 Takte Groove / 2 Takte nur Klick
    function grooveOn(b) {
      if (!isTimingBlock) return true;
      if (b < 8) return true;                          // Takt 0-7 = Takte 1-8: immer Groove
      return Math.floor((b - 8) / 2) % 2 !== 0;       // 0-1=Klick, 2-3=Groove, 4-5=Klick…
    }

    function infoLine(b) {
      var base = cb.bpm + ' BPM — Bar ' + (b + 1) + ' / ' + totalBars;
      if (!isTimingBlock) return base;
      if (b < 8) return base + '  |  Groove';
      return base + (grooveOn(b) ? '  |  Groove  🥁' : '  |  Click only  🎵');
    }

    function tickBeat(bt, br) {
      if (grooveOn(br)) {
        playBeat(bt);
      } else {
        // Nur Klick auf Viertelschläge (Achtel-Pos 0, 2, 4, 6)
        if (bt % 2 === 0) playCountClick(bt === 0 || bt === 4);
      }
    }

    setInfo(infoLine(bar));
    setCountdown(eighthsLeft * eighthMs / 1000);

    if (intId) clearInterval(intId);

    // Erster Schlag sofort
    tickBeat(0, bar); renderNot(0, false);
    eighthsLeft--;
    setCountdown(eighthsLeft * eighthMs / 1000);
    beat = 1;

    intId = setInterval(function() {
      if (!playing) return;
      tickBeat(beat, bar); renderNot(beat, false);
      eighthsLeft--;
      setCountdown(eighthsLeft * eighthMs / 1000);
      beat++;
      if (beat >= 8) {
        beat = 0; bar++;
        setInfo(infoLine(bar));
        if (bar >= totalBars) {
          clearInterval(intId);
          playBlockEnd();
          if (bIdx < blocks.length-1) startPause();
          else finishExercise();
        }
      }
    }, eighthMs);
  }

  function startPause() {
    phase='pause';
    var pd = pauses[bIdx] || 10;
    setBadge('pause'); setInfo('Next: '+blocks[bIdx+1].bpm+' BPM');
    renderNot(-1, true); bIdx++; renderBlocksBar();
    var left = pd; setCountdown(left);
    if (intId) clearInterval(intId);
    intId = setInterval(function() {
      left--; setCountdown(left);
      if (left <= 0) { clearInterval(intId); startCountIn(); }
    }, 1000);
  }

  function playBlockEnd() {
    // Kurzes Signal: 4 schnelle Hi-Hat-Hits als "Block Ende"-Signal
    if (!aCtx) return;
    var now = aCtx.currentTime;
    for (var i = 0; i < 4; i++) {
      (function(t) {
        var o = aCtx.createOscillator();
        var g = aCtx.createGain();
        o.connect(g); g.connect(aCtx.destination);
        o.type = 'sine';
        o.frequency.value = 1800 + i * 200;
        g.gain.setValueAtTime(0.0, t);
        g.gain.linearRampToValueAtTime(0.25, t + 0.01);
        g.gain.exponentialRampToValueAtTime(0.001, t + 0.07);
        o.start(t); o.stop(t + 0.08);
      })(now + i * 0.08);
    }
  }


  function playDoneSound() {
    if (!aCtx) return;
    var now = aCtx.currentTime;
    // Aufsteigendes Dur-Arpeggio: C5 E5 G5 C6
    var steps = [523.25, 659.25, 783.99, 1046.50];
    steps.forEach(function(freq, i) {
      var o = aCtx.createOscillator(), g = aCtx.createGain();
      o.connect(g); g.connect(aCtx.destination);
      o.type = 'sine'; o.frequency.value = freq;
      var t = now + i * 0.13;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.20, t + 0.04);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.55);
      o.start(t); o.stop(t + 0.6);
    });
    // Abschließender weicher Akkord
    [523.25, 659.25, 783.99].forEach(function(freq) {
      var o = aCtx.createOscillator(), g = aCtx.createGain();
      o.connect(g); g.connect(aCtx.destination);
      o.type = 'sine'; o.frequency.value = freq;
      var t = now + 0.55;
      g.gain.setValueAtTime(0, t);
      g.gain.linearRampToValueAtTime(0.10, t + 0.12);
      g.gain.exponentialRampToValueAtTime(0.001, t + 1.8);
      o.start(t); o.stop(t + 1.85);
    });
  }

  function finishExercise() {
    playDoneSound();
    playing=false; phase='done'; bIdx=blocks.length;
    setBadge('done'); setInfo('Great job!'); setCountdown(0);
    renderBlocksBar(); renderNot(-1, false); stopTotal();
    var _milestone = _addLessonTime(_lessonDurationMinutes());
    _updateLevelUI();
    if (_milestone === 'level')   setTimeout(function(){ setInfo('🎯 Level complete!');   }, 800);
    if (_milestone === 'chapter') setTimeout(function(){ setInfo('⭐ Chapter complete!'); }, 800);
    document.getElementById('dgTotal').style.display='block';
    document.getElementById('dgCtrl').innerHTML =
      '<button class="btn-stp" id="dgAgain">▶ Again</button>'+
      '<button class="btn-go" id="dgNextLesson">Next Lesson →</button>'+
      '<button class="btn-stp" id="dgClose">✕ Stop</button>';
    document.getElementById('dgAgain').addEventListener('click', startExercise);
    document.getElementById('dgClose').addEventListener('click', stopExercise);
    document.getElementById('dgNextLesson').addEventListener('click', function() {
      _advanceState();
      _loadCurrentLesson(true);
    });
  }

  function stopExercise() {
    playing=false;
    if (intId) clearInterval(intId);
    stopTotal(); hideCountIn(); phase='idle';
    document.getElementById('dgCtrl').innerHTML = '<button class="btn-go" id="dgStart2">▶ Start</button>';
    document.getElementById('dgStart2').addEventListener('click', startExercise);
    renderNot(-1, false); updateBpm();
  }

  // ============================================================
  // LEERTASTE
  // ============================================================
  document.addEventListener('keydown', function(e) {
    if (e.code !== 'Space') return;
    if (e.target.tagName==='INPUT' || e.target.tagName==='TEXTAREA') return;
    e.preventDefault();
    if (!playing) startExercise(); else stopExercise();
  });

  // ============================================================
  // EVENTS & INIT
  // ============================================================
  document.getElementById('dgStart').addEventListener('click', startExercise);

  // Prev = zurück in der History
  document.getElementById('dgNavPrev').addEventListener('click', function() {
    if (_navPos > 0) _loadHistoryLesson(_navPos - 1, false);
  });

  // Next = vorwärts in History ODER nächste Lektion (Skip)
  document.getElementById('dgNavNext').addEventListener('click', function() {
    if (_navPos < _navHistory.length - 1) {
      // noch History vorhanden → vorwärts blättern
      _loadHistoryLesson(_navPos + 1, false);
    } else {
      // am Ende der History → neue Lektion generieren (Skip)
      _advanceState();
      _loadCurrentLesson(false);
    }
  });

  // Init: erste Lektion aus Course-State laden
  _loadCurrentLesson(false);
  _updateLevelUI();

})();
</script>
